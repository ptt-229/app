        // โหลดตั้งค่าเมื่อเริ่มแอป
        function initApp() {
            // โหลดสี/ภาพ พื้นหลัง
            const savedBgColor = localStorage.getItem('headerBgColor');
            const savedBgImage = localStorage.getItem('headerBgImage');
            
            if (savedBgImage) {
                header.style.backgroundImage = `url(${savedBgImage})`;
            } else if (savedBgColor) {
                header.style.backgroundColor = savedBgColor;
                header.style.backgroundImage = 'none';
            }

            // โหลดรูปร่างปุ่ม
            updateButtonShapeUI(currentShape);
            
            // วาดหน้าจอแท็บแรก
            switchTab(0);
        }

        function switchTab(index) {
            currentTabIndex = index;
            const data = appData[index];
            
            // อัปเดตชื่อหมวดหมู่ที่ Header
            categoryTitle.innerText = data.title;

            // รีเซ็ตคลาสของ Nav Bar
            for(let i=0; i<4; i++) {
                const tab = document.getElementById(`tab-${i}`);
                if(i === index) {
                    tab.classList.remove('text-gray-400');
                    tab.classList.add('text-blue-600');
                } else {
                    tab.classList.remove('text-blue-600');
                    tab.classList.add('text-gray-400');
                }
            }

            // แอนิเมชันตอนโหลดตาราง
            grid.classList.remove('fade-enter-active');
            grid.classList.add('fade-enter');
            
            setTimeout(() => {
            renderGrid(data.items);
            grid.classList.remove('fade-enter');
            grid.classList.add('fade-enter-active');
        }, 50);
    }

    function renderGrid(items) {
        grid.innerHTML = '';
        
        // แปลงชื่อรูปร่างให้ตรงกับคลาส CSS
        let shapeClass = 'shape-rounded';
        if(currentShape === 'square') shapeClass = 'shape-square';
        if(currentShape === 'circle') shapeClass = 'shape-circle';

        items.forEach(item => {
            // โครงสร้างปุ่ม: พื้นหลังปุ่มสีน้ำเงินเข้ม (bg-blue-900) ไอคอนสีขาว
            grid.innerHTML += `
                <a href="${item.link}" target="_blank" class="flex flex-col items-center group touch-manipulation">
                    <div class="w-[4.5rem] h-[4.5rem] bg-blue-900 shadow-md border border-blue-800 flex items-center justify-center mb-2 transition-transform active:scale-95 ${shapeClass}">
                        <i class="fa-solid ${item.icon} text-3xl text-white opacity-90 group-hover:opacity-100"></i>
                    </div>
                    <span class="text-[11px] leading-tight text-center text-gray-700 font-medium px-1 overflow-hidden" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                        ${item.name}
                    </span>
                </a>
            `;
        });
    }

    const modal = document.getElementById('settingsModal');
    const modalContent = document.getElementById('settingsContent');

    const passModal = document.getElementById('passwordModal');
    const passContent = document.getElementById('passwordContent');

    function promptPassword() {
        document.getElementById('adminPassword').value = '';
        document.getElementById('passwordError').classList.add('hidden');
        passModal.classList.remove('hidden');
        setTimeout(() => {
            passModal.classList.remove('opacity-0');
            passContent.classList.remove('scale-95');
        }, 10);
        
        // ให้โฟกัสที่ช่องกรอกรหัสผ่านอัตโนมัติ
        setTimeout(() => {
            document.getElementById('adminPassword').focus();
        }, 300);
    }

    function closePasswordPrompt() {
        passModal.classList.add('opacity-0');
        passContent.classList.add('scale-95');
        setTimeout(() => {
            passModal.classList.add('hidden');
        }, 300);
    }

    function verifyPassword() {
        const pass = document.getElementById('adminPassword').value;
        if (pass === 'admin123') {
            closePasswordPrompt();
            setTimeout(() => {
                toggleSettings();
            }, 300); // รอให้หน้าต่างรหัสผ่านปิดเสร็จก่อนค่อยเปิดตั้งค่า
        } else {
            document.getElementById('passwordError').classList.remove('hidden');
        }
    }

    function toggleSettings() {
        if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                // delay เล็กน้อยให้ display block ทำงานก่อนเปลี่ยน opacity
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function updateHeaderColor(colorHex) {
            header.style.backgroundImage = 'none';
            header.style.backgroundColor = colorHex;
            localStorage.setItem('headerBgColor', colorHex);
            localStorage.removeItem('headerBgImage'); // ลบภาพทิ้งถ้าเลือกสี
        }

        function uploadHeaderImage(input) {
            const file = input.files[0];
            const msg = document.getElementById('uploadMsg');
            
            if (!file) return;

            // ตรวจสอบขนาดไม่ให้เกิน 2MB
            if(file.size > 2 * 1024 * 1024) {
                msg.innerText = "ขนาดไฟล์ใหญ่เกินไป (สูงสุด 2MB)";
                msg.classList.remove('hidden');
                return;
            }
            msg.classList.add('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const dataUrl = e.target.result;
                    header.style.backgroundImage = `url(${dataUrl})`;
                    localStorage.setItem('headerBgImage', dataUrl);
                } catch (err) {
                    msg.innerText = "พื้นที่จัดเก็บเต็ม กรุณาลบรูปก่อนหน้า";
                    msg.classList.remove('hidden');
                }
            }
            reader.readAsDataURL(file);
        }

        function clearHeaderImage() {
            localStorage.removeItem('headerBgImage');
            localStorage.removeItem('headerBgColor'); // ล้างค่าสีด้วยเพื่อให้กลับไปใช้ภาพตั้งต้น
            document.getElementById('bgUpload').value = '';
            
            // กลับไปใช้ภาพและสีเริ่มต้น
            header.style.backgroundImage = "url('https://img2.pic.in.th/Copilot_20260516_140912.png')";
            header.style.backgroundColor = '#2563eb';
            
            const msg = document.getElementById('uploadMsg');
            msg.classList.add('hidden');
        }

        function updateButtonShape(shape) {
            currentShape = shape;
            localStorage.setItem('btnShape', shape);
            updateButtonShapeUI(shape);
            
            // วาดตารางใหม่เพื่อให้ปุ่มเปลี่ยนรูปร่าง
            renderGrid(appData[currentTabIndex].items);
        }

        function updateButtonShapeUI(shape) {
            // ล้างสไตล์ปุ่มเลือกรูปร่างในหน้าตั้งค่า
            const btns = document.querySelectorAll('#settingsContent .grid button');
            btns.forEach(b => {
                b.classList.remove('bg-white', 'shadow', 'text-blue-600');
                b.classList.add('text-gray-600');
            });

            // ไฮไลต์ปุ่มที่เลือก
            const activeBtn = document.querySelector(`#settingsContent button[onclick="updateButtonShape('${shape}')"]`);
            if(activeBtn) {
                activeBtn.classList.remove('text-gray-600');
                activeBtn.classList.add('bg-white', 'shadow', 'text-blue-600');
            }
        }

        // เริ่มต้นแอป
        window.onload = initApp;
    </script>
</body>
</html>
