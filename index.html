# ไฟล์ index.html (สมบูรณ์)

```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสารสนเทศ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'K2D',sans-serif;
}

body{
background:#f4f7fb;
overflow-x:hidden;
}

.header{
position:relative;
background:linear-gradient(135deg,#1565c0,#1e88e5);
color:white;
text-align:center;
padding:30px 20px 90px;
border-radius:0 0 35px 35px;
overflow:hidden;
transition:.3s;
}

.header::before{
content:'';
position:absolute;
inset:0;
background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1200') center/cover;
opacity:.18;
}

.header-content{
position:relative;
z-index:2;
}

.logo{
width:110px;
height:110px;
object-fit:contain;
border-radius:50%;
filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));
margin-bottom:14px;
}

.title{
font-size:34px;
font-weight:700;
}

.subtitle{
margin-top:5px;
font-size:18px;
}

.menu-toggle{
position:absolute;
top:18px;
left:18px;
width:48px;
height:48px;
border:none;
border-radius:15px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
color:white;
font-size:22px;
cursor:pointer;
z-index:99;
}

.search-box{
width:92%;
margin:-35px auto 20px;
position:relative;
z-index:5;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:22px;
font-size:16px;
box-shadow:0 6px 15px rgba(0,0,0,.12);
outline:none;
}

.menu-container{
padding:12px;
padding-bottom:120px;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
}

.menu-item{
background:white;
border-radius:24px;
padding:20px 10px;
text-align:center;
text-decoration:none;
color:#333;
box-shadow:0 5px 14px rgba(0,0,0,.08);
transition:.25s;
position:relative;
}

.menu-item:hover{
transform:translateY(-4px);
}

.menu-icon{
width:66px;
height:66px;
margin:auto;
border-radius:20px;
background:linear-gradient(135deg,#42a5f5,#1976d2);
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
margin-bottom:12px;
}

.menu-title{
font-size:13px;
font-weight:600;
line-height:1.4;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -4px 12px rgba(0,0,0,.08);
z-index:999;
}

.bottom-nav button{
border:none;
background:none;
display:flex;
flex-direction:column;
align-items:center;
gap:5px;
color:#555;
font-size:12px;
cursor:pointer;
}

.bottom-nav button.active{
color:#1565c0;
font-weight:700;
}

.bottom-nav i{
font-size:22px;
}

.side-menu{
position:fixed;
top:0;
left:-280px;
width:260px;
height:100%;
background:white;
z-index:9999;
box-shadow:4px 0 15px rgba(0,0,0,.12);
transition:.35s;
padding:20px;
overflow:auto;
}

.side-menu.active{
left:0;
}

.side-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.close-btn{
border:none;
background:none;
font-size:24px;
cursor:pointer;
}

.side-menu button{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
border-radius:16px;
background:#1565c0;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.admin-panel{
display:none;
margin-top:20px;
}

.color-list{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px;
}

.color-btn{
height:40px;
border:none;
border-radius:12px;
cursor:pointer;
}

@media(max-width:480px){
.menu-grid{
grid-template-columns:repeat(3,1fr);
}
}
</style>
</head>

<body>

<div class="side-menu" id="sideMenu">

<div class="side-header">
<h2>เมนูระบบ</h2>
<button class="close-btn" onclick="closeMenu()">✕</button>
</div>

<button onclick="adminLogin()">⚙️ จัดการระบบ</button>

<div class="admin-panel" id="adminPanel">

</div>

</div>

</div>

<div class="header" id="header">

<button class="menu-toggle" onclick="openMenu()">
<i class="fa-solid fa-bars"></i>
</button>

<div class="header-content">

<div class="subtitle">สกร.ระดับอำเภอพุทธมณฑล</div>

</div>

<div class="search-box">

</div>

<div class="menu-container">
<div class="menu-grid" id="menuGrid"></div>
</div>

<div class="bottom-nav">
<button class="nav-btn active" onclick="loadMenu('admin',this)">
<i class="fa-solid fa-building"></i>
อำนวยการ
</button>

ตลอดชีวิต
</button>

<button class="nav-btn" onclick="loadMenu('develop',this)">

พัฒนาตนเอง
</button>

<button class="nav-btn" onclick="loadMenu('edu',this)">
<i class="fa-solid fa-graduation-cap"></i>
คุณวุฒิตามระดับ
</button>
</div>

<script>

{title:'ไดอารี่ดิจิทัล',icon:'fa-book-open-reader',link:'https://ptt-229.github.io/diary/'}
]
};

const menuGrid=document.getElementById('menuGrid');

function loadMenu(type,btn){
menuGrid.innerHTML='';
menus[type].forEach(menu=>{
menuGrid.innerHTML += `
<a class="menu-item" href="${menu.link}" target="_blank">
<div class="menu-icon">
<i class="fa-solid ${menu.icon}"></i>
</div>
<div class="menu-title">${menu.title}</div>
</a>`;
});

document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
if(btn){btn.classList.add('active');}
}

loadMenu('admin');

function openMenu(){
document.getElementById('sideMenu').classList.add('active');
}

function closeMenu(){
document.getElementById('sideMenu').classList.remove('active');
}

function adminLogin(){
const pass = prompt('กรุณาใส่รหัสผ่าน');
if(pass === 'admin123'){
document.getElementById('adminPanel').style.display='block';
alert('เข้าสู่ระบบสำเร็จ');
}else{
alert('รหัสผ่านไม่ถูกต้อง');
}
}

function changeHeader(color){
document.getElementById('header').style.background=color;
}

document.getElementById('searchInput').addEventListener('keyup',function(){
const keyword=this.value.toLowerCase();
document.querySelectorAll('.menu-item').forEach(item=>{
const text=item.innerText.toLowerCase();
item.style.display=text.includes(keyword)?'block':'none';
});
});

</script>
