<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบสารสนเทศ</title>

<!-- FONT K2D -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'K2D',sans-serif;
}

body{
  background:#f4f7fb;
  overflow-x:hidden;
}

/* HEADER */

.header{
  position:relative;
  background:linear-gradient(135deg,#1565c0,#1e88e5);
  color:white;
  text-align:center;
  padding:30px 20px 90px;
  border-radius:0 0 35px 35px;
  overflow:hidden;
  transition:.3s;
}

.header::before{
  content:'';
  position:absolute;
  inset:0;
  background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1200') center/cover;
  opacity:.18;
}

.header-content{
  position:relative;
  z-index:2;
}

.logo{
  width:95px;
  height:95px;
  background:white;
  border-radius:50%;
  padding:8px;
  object-fit:contain;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  margin-bottom:12px;
}

.title{
  font-size:32px;
  font-weight:700;
}

.subtitle{
  margin-top:5px;
  font-size:18px;
}

/* SEARCH */

.search-box{
  width:92%;
  margin:-35px auto 20px;
  position:relative;
  z-index:5;
}

.search-box input{
  width:100%;
  padding:18px;
  border:none;
  border-radius:22px;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,.12);
  outline:none;
}

/* ADMIN BUTTON */

.admin-button{
  text-align:center;
  margin-bottom:20px;
}

.admin-button button{
  background:#1565c0;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:18px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* MENU */

.menu-container{
  padding:12px;
  padding-bottom:120px;
}

/* 3 ปุ่มต่อแถว */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.menu-item{
  background:white;
  border-radius:26px;
  padding:20px 10px;
  text-align:center;
  color:#333;
  text-decoration:none;
  box-shadow:0 5px 14px rgba(0,0,0,.08);
  transition:.25s;
  position:relative;
}

.menu-item:hover{
  transform:translateY(-4px);
}

.menu-icon{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:22px;
  background:linear-gradient(135deg,#42a5f5,#1976d2);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  margin-bottom:12px;
}

.menu-title{
  font-size:14px;
  font-weight:600;
  line-height:1.4;
}

/* DELETE BUTTON */

.delete-btn{
  position:absolute;
  top:6px;
  right:6px;
  width:24px;
  height:24px;
  border:none;
  border-radius:50%;
  background:red;
  color:white;
  display:none;
  cursor:pointer;
}

.admin-mode .delete-btn{
  display:block;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.08);
  z-index:999;
}

.bottom-nav button{
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  color:#555;
  font-size:12px;
  cursor:pointer;
}

.bottom-nav button.active{
  color:#1565c0;
  font-weight:700;
}

.bottom-nav i{
  font-size:24px;
}

/* ADMIN PANEL */

#adminPanel{
  position:fixed;
  top:0;
  right:-100%;
  width:100%;
  height:100%;
  background:white;
  z-index:9999;
  transition:.4s;
  overflow:auto;
  padding:20px;
}

.admin-input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
}

.admin-btn{
  width:100%;
  padding:14px;
  border:none;
  color:white;
  border-radius:12px;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
}

.green{
  background:#2e7d32;
}

.red{
  background:#d32f2f;
}

.color-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.color-btn{
  width:100%;
  height:50px;
  border:none;
  border-radius:14px;
  cursor:pointer;
}

</style>
</head>

<h3 style="margin-top:30px;">➕ เพิ่มปุ่มใหม่</h3>

<input id="newTitle"
class="admin-input"
placeholder="ชื่อปุ่ม">

<input id="newLink"
class="admin-input"
placeholder="ลิงก์">

<input id="newIcon"
class="admin-input"
placeholder="ไอคอน เช่น fa-book">

<select id="menuType"
class="admin-input">

<option value="life">ตลอดชีวิต</option>

เพิ่มปุ่ม

<button onclick="closeAdmin()"

},

{

{

const menuGrid =
document.getElementById('menuGrid');

function loadMenu(type,btn){

currentMenu = type;

document.querySelectorAll('.nav-btn')
.forEach(b=>b.classList.remove('active'));

if(btn){
btn.classList.add('active');
}

menuGrid.innerHTML='';

menus[type].forEach((menu,index)=>{

menuGrid.innerHTML += `

<div class="menu-item ${adminMode ? 'admin-mode':''}">

<button class="delete-btn"
onclick="deleteMenu('${type}',${index})">

✖

</button>

<a href="${menu.link}"
target="_blank"
style="text-decoration:none;color:#333;">

<div class="menu-icon">

<i class="fa-solid ${menu.icon}"></i>

</div>

<div class="menu-title">

${menu.title}

</div>

</a>

</div>

`;

});

}

loadMenu(
'admin',
document.querySelector('.nav-btn')
);

/* SEARCH */

document.getElementById('searchInput')
.addEventListener('keyup',function(){

const keyword =
this.value.toLowerCase();

document.querySelectorAll('.menu-item')
.forEach(item=>{

const text =
item.innerText.toLowerCase();

item.style.display =
text.includes(keyword)
? 'block'
: 'none';

});

});

/* ADMIN */

function openAdmin(){

const password =
prompt('กรุณาใส่รหัสผ่าน');

if(password === ADMIN_PASSWORD){

adminMode = true;

document.getElementById('adminPanel')
.style.right='0';

loadMenu(
currentMenu,
document.querySelector('.nav-btn.active')
);

}
else{

alert('รหัสผ่านไม่ถูกต้อง');

}

}

function closeAdmin(){

document.getElementById('adminPanel')
.style.right='-100%';

}

/* CHANGE HEADER */

function changeHeader(color){

document.getElementById('header')
.style.background=color;

localStorage.setItem(
'headerColor',
color
);

}

window.onload=function(){

const savedColor =
localStorage.getItem('headerColor');

if(savedColor){

document.getElementById('header')
.style.background=savedColor;

}

}

/* ADD MENU */

function addMenu(){

const title =
document.getElementById('newTitle').value;

const link =
document.getElementById('newLink').value;

const icon =
document.getElementById('newIcon').value;

const type =
document.getElementById('menuType').value;

if(title=='' || link==''){

alert('กรอกข้อมูลให้ครบ');
return;

}

menus[type].push({

title:title,
icon:icon || 'fa-star',
link:link

});

loadMenu(
type,
document.querySelector('.nav-btn.active')
);

alert('เพิ่มปุ่มสำเร็จ');

document.getElementById('newTitle').value='';
document.getElementById('newLink').value='';
document.getElementById('newIcon').value='';

}

/* DELETE MENU */

function deleteMenu(type,index){

if(confirm('ต้องการลบปุ่มนี้ ?')){

menus[type].splice(index,1);

loadMenu(
type,
document.querySelector('.nav-btn.active')
);

}

}

</script>
