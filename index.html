<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบสารสนเทศ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'K2D',sans-serif;
}

body{
  background:#f4f7fb;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#1565c0,#1e88e5);
  color:white;
  text-align:center;
  padding:30px 20px 90px;
  border-radius:0 0 35px 35px;
  position:relative;
  overflow:hidden;
}

.header::before{
  content:'';
  position:absolute;
  inset:0;
  background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1200') center/cover;
  opacity:.18;
}

.header-content{
  position:relative;
  z-index:2;
}

.logo{
  width:95px;
  height:95px;
  background:white;
  border-radius:50%;
  padding:8px;
  object-fit:contain;
  margin-bottom:12px;
}

.title{
  font-size:34px;
  font-weight:700;
}

.subtitle{
  font-size:20px;
  margin-top:5px;
}

/* SEARCH */

.search-box{
  width:92%;
  margin:-35px auto 20px;
  position:relative;
  z-index:5;
}

.search-box input{
  width:100%;
  padding:18px;
  border:none;
  border-radius:22px;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,.12);
  outline:none;
}

/* ADMIN BUTTON */

.admin-button{
  text-align:center;
  margin-bottom:20px;
}

.admin-button button{
  background:#1565c0;
  color:white;
  border:none;
  padding:15px 30px;
  border-radius:18px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.15);
}

/* MENU */

.menu-container{
  padding:12px;
  padding-bottom:110px;
}

/* สำคัญมาก */
/* 3 ปุ่มต่อแถว */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.menu-item{
  background:white;
  border-radius:26px;
  padding:20px 10px;
  text-align:center;
  text-decoration:none;
  color:#333;
  box-shadow:0 5px 14px rgba(0,0,0,.08);
}

.menu-icon{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:22px;
  background:linear-gradient(135deg,#42a5f5,#1976d2);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  margin-bottom:12px;
}

.menu-title{
  font-size:14px;
  font-weight:600;
  line-height:1.4;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  box-shadow:0 -4px 12px rgba(0,0,0,.08);
}

.bottom-nav button{
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  color:#555;
  font-size:12px;
  font-family:'K2D',sans-serif;
}

.bottom-nav i{
  font-size:24px;
}

.bottom-nav .active{
  color:#1565c0;
  font-weight:700;
}

</style>
</head>

<body>

<div class="header">

<div class="header-content">

<img class="logo"
src="https://img2.pic.in.th/000ac3156996f8d3f82f03e25393bd1f.png">

<div class="title">
ระบบสารสนเทศ
</div>

<div class="subtitle">
สกร.ระดับอำเภอพุทธมณฑล
</div>

</div>

</div>

<div class="search-box">

<input type="text"
placeholder="ค้นหาระบบ...">

</div>

<div class="admin-button">

<button>
⚙️ จัดการระบบ
</button>

</div>

<div class="menu-container">

<div class="menu-grid">

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-file-lines"></i>
</div>
<div class="menu-title">
สารบรรณอิเล็กทรอนิกส์
</div>
</div>

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-users"></i>
</div>
<div class="menu-title">
บุคลากรอบรม/ประชุม
</div>
</div>

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-user-gear"></i>
</div>
<div class="menu-title">
บริหารบุคลากร
</div>
</div>

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-umbrella-beach"></i>
</div>
<div class="menu-title">
ลาพักผ่อน
</div>
</div>

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-calendar-days"></i>
</div>
<div class="menu-title">
สรุปวันลา
</div>
</div>

<div class="menu-item">
<div class="menu-icon">
<i class="fa-solid fa-box"></i>
</div>
<div class="menu-title">
เบิกจ่ายพัสดุ
</div>
</div>

</div>

</div>

<div class="bottom-nav">

<button class="active">
<i class="fa-solid fa-building"></i>
อำนวยการ
</button>

<button>
<i class="fa-solid fa-book"></i>
ตลอดชีวิต
</button>

<button>
<i class="fa-solid fa-rocket"></i>
พัฒนาตนเอง
</button>

<button>
<i class="fa-solid fa-graduation-cap"></i>
คุณวุฒิตามระดับ
</button>

</div>

</body>
</html>
